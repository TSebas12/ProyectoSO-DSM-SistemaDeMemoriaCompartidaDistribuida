# Nodo 0 (home) — pareja #3, puertos 27300-27303.
# bind_address 0.0.0.0 permite correr el nodo en otra PC; en pruebas locales
# las conexiones llegan por 127.0.0.1 segun config/nodes.conf.
config_version = 1
node_id = 0
max_nodes = 16
bind_address = 0.0.0.0
listen_port = 27300
control_port = 27301
heartbeat_port = 27302
web_port = 27303
web_enabled = 1
seed_host = 127.0.0.1
seed_port = 27300
page_size = 4096
node_memory = 1048576
window_size = 268435456
heartbeat_interval_ms = 1000
heartbeat_timeout_ms = 3000
network_timeout_ms = 10000
connect_timeout_ms = 5000
retry_count = 5
retry_backoff_ms = 500
max_message_size = 8192
thread_pool_size = 32
fault_queue_size = 1024
eviction_policy = 0
log_level = 2
log_file = logs/dsm-node0.log
stats_interval_ms = 5000
barrier_timeout_ms = 30000
replication_factor = 0
checkpoint_interval_ms = 0
scheduler_policy = 0
port_range_start = 27300
port_range_end = 27399
